name: Build-Push-Deploy

on:
  push:
    branches: [ "master" ]

jobs:
  build_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build with Maven
        run: mvn -B package

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/java-docker-app:latest .

      - name: Push Docker Image to DockerHub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/java-docker-app:latest

  deploy:
    needs: build_push
    runs-on: [self-hosted, ubuntu2204]
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy container locally
        run: |
          docker rm -f javaapp || true
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/java-docker-app:latest
          docker run -d -p 8085:8080 --name javaapp ${{ secrets.DOCKERHUB_USERNAME }}/java-docker-app:latest
          docker ps
